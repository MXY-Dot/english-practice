<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Source for og-image.png (1200×630), rendered by tools/make-images.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; font-family: 'Nunito', sans-serif; color: #fff;
    background: radial-gradient(700px 500px at 0% 0%, #b46bff 0%, transparent 60%),
                radial-gradient(700px 500px at 100% 100%, #ff8fb1 0%, transparent 60%), #6a4cf0;
    display: flex; flex-direction: column; justify-content: center; padding: 0 90px; box-sizing: border-box; position: relative;
  }
  .dots { display: flex; gap: 12px; margin-bottom: 34px; }
  .dots span { width: 26px; height: 26px; border-radius: 50%; border: 4px solid rgba(255,255,255,.85); }
  .mark { position: absolute; right: 90px; top: 80px; width: 150px; height: 150px; border-radius: 38px; background: rgba(255,255,255,.95);
    color: #7c5cff; display: grid; place-items: center; font-weight: 900; font-size: 64px; box-shadow: 0 20px 50px rgba(40,20,90,.35); }
  h1 { font-size: 86px; line-height: 1; margin: 0 0 22px; font-weight: 900; letter-spacing: -1px; }
  p { font-size: 36px; margin: 0; font-weight: 700; opacity: .95; max-width: 900px; line-height: 1.3; }
  .chips { display: flex; gap: 14px; margin-top: 40px; flex-wrap: wrap; }
  .chips span { background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.35); padding: 10px 22px; border-radius: 999px; font-size: 26px; font-weight: 800; }
</style>
</head>
<body>
  <div class="dots">
    <span style="background:#ef5d6b"></span><span style="background:#4f7cff"></span><span style="background:#22a06b"></span>
    <span style="background:#f08a24"></span><span style="background:#a35ee8"></span><span style="background:#0f9fb5"></span>
  </div>
  <div class="mark">EP</div>
  <h1>Elementary Practice</h1>
  <p>Задания по английскому для ученика и учителя: 36 уроков, 1800 заданий</p>
  <div class="chips"><span>Грамматика</span><span>Аудирование</span><span>Произношение</span><span>Проверка учителем</span></div>
</body>
</html>
